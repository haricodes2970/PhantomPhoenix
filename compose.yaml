services:
  postgres:
    image: postgres:17-alpine
    container_name: phantom-phoenix-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phantom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phantom}
      POSTGRES_DB: ${POSTGRES_DB:-phantom_phoenix}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-phantom} -d ${POSTGRES_DB:-phantom_phoenix}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: