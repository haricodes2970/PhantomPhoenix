# Staging overrides (Milestone 13) — apply on top of compose.yaml:
#   docker compose -p pp-staging -f compose.yaml -f compose.staging.yaml up -d
# Fail-closed requirements: .env must define AUTH_SECRET (>=32 chars) and a
# strong POSTGRES_PASSWORD; the backend service already interpolates
# AUTH_SECRET with the ':?' error syntax (inherited). Enforced:
#   * COOKIE_SECURE=true (cookies only sent over HTTPS)
#   * Postgres + TLS proxy bound to loopback only
#   * CORS allows the staging public origin
#
# NOTE: host port 443 was occupied by local tooling during validation, so the
# TLS listener binds 127.0.0.1:8443 and HTTP redirects target :8443.

services:
  postgres:
    ports:
      - "127.0.0.1:5433:5432"

  backend:
    environment:
      - COOKIE_SECURE=true
      # Staging TLS serves both loopback names (127.0.0.1:8443 + localhost:8443,
      # same socket) — both must be allowlisted or browser Origin checks 403.
      - CORS_ORIGINS_CSV=http://localhost:5173,http://127.0.0.1:5173,https://localhost:8443,https://127.0.0.1:8443

  tlsproxy:
    image: nginx:alpine
    container_name: phoenix-staging-tls
    depends_on:
      - frontend
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/staging/nginx-tls.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./deploy/staging/certs:/etc/nginx/staging-certs:ro,z
