# PHANTOM PHOENIX — staging TLS termination proxy (Milestone 13)
# Terminates HTTPS for the whole stack and redirects plain HTTP.
# Public entry: 8443 (TLS) -> frontend (SPA + /api via nginx)
# Upstream headers are forwarded explicitly; the proxy is the only trusted hop.

server {
    listen 8080;
    server_name _;

    # HTTP is redirected to HTTPS at the public entry point
    return 301 https://$host:8443$request_uri;
}

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    # Self-signed staging certificate (generated by gen-staging-cert.sh).
    # Replace with a CA-signed cert for any real staging deployment.
    ssl_certificate     /etc/nginx/staging-certs/phoenix-staging.crt;
    ssl_certificate_key /etc/nginx/staging-certs/phoenix-staging.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;

    client_max_body_size 16m;

    location / {
        proxy_pass         http://frontend:80;
        proxy_set_header   Host              $host;
        # forwarded headers — trusted ONLY from this proxy
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_http_version 1.1;
    }
}
